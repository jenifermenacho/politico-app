name: Atualizar Dados dos Politicos

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js v18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Instalar dependencias Node
        run: npm install

      - name: Buscar dados dos Deputados
        run: node fetch-data.js

      - name: Buscar dados dos Senadores
        run: node fetch-senadores.js

      - name: Commit e Push dos dados atualizados
        run: |
          git config --global user.name  'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add assets/ranking.json
          git diff --staged --quiet || git commit -m "chore: atualiza ranking.json [skip ci]"
          git push
